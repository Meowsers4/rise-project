# Conda environment for the SOD1 FEP variant pipeline (GROMACS + pmx).
#   module load miniconda/25.3.1
#   conda env create -f env/environment.yml     (or: mamba env create -f ...)
#   conda activate sod1-fep
#
# GROMACS is NOT here -- it comes from the SCC module (cluster.gromacs_module) so the
# cluster's own CUDA build is used, not a generic conda one.
#
# This env has only two jobs: prepare structures (Stage 1, via PDBFixer, which imports
# OpenMM's app layer) and analyse free energies (Stage 3, MBAR over GROMACS dhdl output).
# The alchemical transformation itself is GROMACS + pmx, so there is no OpenMM MD engine,
# no openmmtools and no perses -- this solves in minutes rather than an hour.
name: sod1-fep
channels:
  - conda-forge
dependencies:
  - python=3.11
  # --- structure prep (Stage 1) -- PDBFixer imports openmm.app ---
  - openmm>=8.1
  - pdbfixer
  # --- free-energy analysis (Stage 3) ---
  - pymbar>=4
  - alchemlyb          # parses GROMACS dhdl.xvg -> u_nk matrices for MBAR
  - pandas             # alchemlyb returns DataFrames
  # --- data / scientific stack ---
  - numpy
  - scipy
  - pyyaml
  # --- dev / test ---
  - pytest
  - pip
  - pip:
      # pmx is not on conda-forge. NOTE THE BRANCH: deGrootLab/pmx `master` is the legacy
      # PYTHON 2 codebase (its metadata declares Requires-Python <3,>=2.7, so pip refuses
      # it on 3.11). The Python 3 port is on `develop` -- that is the one we need.
      - pmx @ git+https://github.com/deGrootLab/pmx.git@develop
# NOTE: snakemake is deliberately absent -- Stage 3 dispatches via SGE qsub arrays
# (scripts/submit_array.sh). Install it separately on a login node if you want the DAG.
