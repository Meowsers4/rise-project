# pipeline.yaml — global parameters for the SOD1 FEP variant pipeline
# Every stage reads from here. Do not hardcode these values in scripts.
# README.md §9 (Open decisions) resolved 2026-07-16 with the user. No TODOs remain.

project:
  name: sod1-fep
  target: SOD1
  uniprot: P00441
  # Mature protein has initiator Met removed -> 153 residues.
  # Variant names (A4V, G93A) use MATURE numbering. This offset lives here, once.
  mature_offset: 1          # precursor_pos = mature_pos + mature_offset
  n_residues_mature: 153

structure:
  form: apo                 # apo | holo   -- KEEP apo for v1 (README §2.1)
  disulfide: reduced        # reduced | oxidized  (apo disease-relevant = reduced)
  starting_pdb: 3ECU        # apo, reduced, WT human SOD1 dimer, 1.90 Å (RCSB 3ECU)
  fallback_pdb: 2C9V        # 1.07 Å metallated; strip metals + re-equilibrate IF apo loop rebuild is unstable
  default_oligomer: monomer # monomer | dimer -- per-variant override in variants.csv
  interface_cutoff_A: 5.0   # residue -> dimer if any heavy atom within this of the partner monomer (Stage 0)
  water_model: tip3p
  ff_protein: amber14sb     # or charmm36m if using GROMACS+CHARMM
  ion_conc_M: 0.15

panel:
  csv: data/variants.csv
  target_size: 40           # v1 panel size (README suggests 30-50)
  min_positive_controls: 10 # gate power depends on control count+spread (D3); quality over count
  require_controls: true    # fail fast if no positive controls present
  buckets:                  # expected stratification labels
    - positive_control
    - negative_control
    - pathogenic_uncharacterized
    - vus

prescreen:                  # Stage 2 — cheap empirical ddG (CPU)
  methods:
    - foldx
    - rosetta_cartesian_ddg
  runs_per_variant: 5       # FoldX BuildModel averaging
  validate_on_controls: true

fep:                        # Stage 3 — the cluster workhorse (GPU)
  framework: openmm_perses  # openmm_perses | gromacs_pmx | amber_ti  (resolved: OpenMM+Perses)
  lambda_windows: 18        # 12 | 18 | 24  -- cost vs precision
  replicates: 5             # >=3 required; 5 recommended
  legs:                     # thermodynamic cycle
    - folded                # mutation in the folded protein
    - unfolded              # mutation in capped tripeptide reference
  softcore: true
  estimator: mbar
  ns_per_window: 5          # production time per lambda window
  equilibration_ns: 1
  convergence:
    max_cycle_closure_kcal: 1.0   # flag if thermodynamic cycle doesn't close
    check_hysteresis: true

md:                         # Stage 4 — unbiased mechanism MD (GPU, subset)
  run_on: fep_flagged       # only variants FEP flags as interesting
  replicates: 3
  ns_per_replicate: 200
  analyses:
    - rmsf
    - contact_map
    - salt_bridges
    - sasa
    - dimer_interface

validation:                 # Stage 5 — the GATE (README §2.2)
  gate_on: positive_control
  min_pearson: 0.6          # go/no-go threshold vs experimental ddG
  cross_check: [foldx, rosetta_cartesian_ddg]
  outputs:
    ddg_map: results/ddg_map.csv
    figures: results/figures/

cluster:
  scheduler: sge                 # BU SCC runs Open Grid Scheduler (SGE/OGS), NOT SLURM
  project: rise-batteries        # SGE -P flag
  gpu_c: "7.0"                   # request GPUs by compute capability >=7.0, not by model name
  gpus_available: 8              # planning/throughput number ONLY -- not requested in a single qsub
  pe_omp: 8                      # -pe omp slots (CPU cores per task)
  max_walltime_hr: 12            # stay <=12h to keep buy-in nodes in the pool
  array_unit: [variant, leg, window, replicate]   # one SGE array task (qsub -t) per tuple
  checkpoint: true
  trajectory_retention: estimates_only            # keep ddG + analysis, drop raw frames
